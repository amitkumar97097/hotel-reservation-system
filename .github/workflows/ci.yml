
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      LOG_LEVEL: error
      MONGODB_URI: mongodb://127.0.0.1:27017/hotel_reservation?replicaSet=rs0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start MongoDB replica set
        run: |
          docker run -d \
            --name hotel-mongodb \
            -p 27017:27017 \
            mongo:7.0 \
            mongod --replSet rs0 --bind_ip_all

      - name: Initialize MongoDB replica set
        run: |
          for i in $(seq 1 30); do
            if docker exec hotel-mongodb mongosh --quiet --eval \
              'db.adminCommand("ping").ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 2
          done

          docker exec hotel-mongodb mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'

          for i in $(seq 1 30); do
            if docker exec hotel-mongodb mongosh --quiet --eval \
              'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo "MongoDB replica set is ready."
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB replica set did not become ready."
          docker logs hotel-mongodb
          exit 1

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
